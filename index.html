<!DOCTYPE html>
<html lang="en">
<a href"Lawan.html </a>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Letter For Mrs. Zynab ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #ffb6c1;
            position: relative;
        }

        /* Subtitle/Badge for her title */
        .title-badge {
            display: inline-block;
            background-color: #ffe6e8;
            color: #d32f2f;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            border: 1px solid #ffccd5;
        }

        h1 {
            color: #d32f2f;
            font-size: 26px;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .romantic-text {
            color: #4a4a4a;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 28px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background-color: #e91e63;
            color: white;
        }

        #yesBtn:hover {
            background-color: #c2185b;
            transform: scale(1.08);
        }

        #noBtn {
            background-color: #757575;
            color: white;
            position: relative;
        }

        #response {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            color: #c2185b;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="title-badge">🩺 Dr. Zynab (Nurse) 💖</div>
        <h1>For My Dearest Mrs. Zynab ❤️</h1>
        
        <p class="romantic-text">
            "My love, every single day my feelings for you grow deeper than words can say. 
            You heal my heart and bring peace to my soul. Will you make me the happiest person alive?"
        </p>
        
        <div class="buttons-container">
            <button id="yesBtn" onclick="acceptOffer()">Yes, Forever! 💖</button>
            <button id="noBtn" onmouseover="moveButton()">No 😜</button>
        </div>

        <div id="response"></div>
    </div>

    <script>
        function acceptOffer() {
            document.getElementById("response").innerHTML = 
                "You just made my dream come true, Mrs. Zynab! 🌹<br>I promise to cherish and love you endlessly, today and always. ❤️✨";
            document.getElementById("noBtn").style.display = "none";
            document.getElementById("yesBtn").style.transform = "scale(1.15)";
        }

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            noBtn.style.position = "fixed"; 
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 60);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }
    </script>

</body>
</html>
